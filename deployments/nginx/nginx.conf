# nginx/nginx.conf

events {
    worker_connections 1024;   # max connections per worker process
}

http {

    # --- Rate limiting: 10 requests per second per client IP ---
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    # --- Load balancing: api-v1 runs as 3 replicas (round robin) ---
    upstream api_v1 {
        server api-v1:8000;
    }

    # --- api-v2: the "debug" version ---
    upstream api_v2 {
        server api-v2:8000;
    }

    # --- A/B testing: header "X-Experiment-Group: debug" -> api-v2 ---
    map $http_x_experiment_group $api_backend {
        default  api_v1;      # no header or another value -> api-v1
        debug    api_v2;      # header value "debug"       -> api-v2
    }

    # --- HTTP server (port 80) ---
    server {
        listen 80;
        server_name localhost;

        # Nginx metrics for the exporter (only from inside Docker)
        location /nginx_status {
            stub_status on;          # switch on Nginx's built-in counters
            access_log off;          # don't log these frequent checks
            allow 127.0.0.1;         # the container itself
            allow 172.16.0.0/12;     # Docker networks (172.16.x.x to 172.31.x.x)
            allow 192.168.0.0/16;    # Docker networks on other machines
            deny all;                # everybody else
        }

        # Everything else: redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS server (port 443) ---
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /predict {
            # Basic authentication (users and passwords in .htpasswd)
            auth_basic "API Access Protected";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Rate limiting: use the zone defined above
            limit_req zone=apilimit burst=5 nodelay;

            # Reverse proxy: api_v1 or api_v2, chosen by the map above
            proxy_pass http://$api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
