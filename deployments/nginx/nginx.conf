# nginx/nginx.conf

events {
    worker_connections 1024;   # max connections per worker process
}

http {

    # --- Load balancing: api-v1 runs as 3 replicas (round robin) ---
    upstream api_v1 {
        server api-v1:8000;
    }

    # --- HTTP server (port 80): redirect everything to HTTPS ---
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS server (port 443) ---
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /predict {
            # Reverse proxy: send the request to the api_v1 group
            proxy_pass http://api_v1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
